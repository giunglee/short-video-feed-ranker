[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-ranker"
version = "0.1.0"
description = "Reproducible recommendation modeling experiments on public data"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0,<3",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyarrow>=14,<24",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]
eda = ["nbformat>=5,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
